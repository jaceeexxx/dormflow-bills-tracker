<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DormFlow">
  <meta name="description" content="DormFlow · 20 St. Paul">
  <title>DormFlow · 20 St. Paul</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="icon" href="assets/brand/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark" aria-hidden="true"><span></span><i></i><b></b></div>
      <div class="auth-heading"><strong>DormFlow</strong><span>20 St. Paul</span></div>
      <form id="signin-form" class="signin-form" novalidate>
        <label><span>Email</span><input id="signin-email" name="email" type="email" autocomplete="username" required></label>
        <label><span>Password</span><input id="signin-password" name="password" type="password" autocomplete="current-password" required></label>
        <p id="signin-error" class="form-error" role="alert" hidden></p>
        <button id="signin-submit" class="primary-action" type="submit">Sign in</button>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="desktop-rail" aria-label="DormFlow navigation">
      <button class="rail-brand" type="button" data-route="home" aria-label="DormFlow home"><span class="brand-mark small" aria-hidden="true"><span></span><i></i><b></b></span><strong>DormFlow</strong></button>
      <nav id="desktop-nav" class="desktop-nav"></nav>
      <div class="rail-account"><button id="desktop-profile" type="button" data-route="profile">Account</button><button id="signout-button" type="button">Sign out</button></div>
    </aside>

    <div class="app-stage">
      <header class="app-header">
        <button class="compact-brand" type="button" data-route="home" aria-label="DormFlow home"><span class="brand-mark tiny" aria-hidden="true"><span></span><i></i><b></b></span><strong>DormFlow</strong></button>
        <div class="header-actions"><div id="mode-switcher" class="mode-switcher" hidden></div><button id="notification-button" class="icon-button" type="button" data-route="notifications" aria-label="Notifications"></button><button id="profile-button" class="profile-button" type="button" data-route="profile"><span id="profile-initial">D</span></button></div>
      </header>
      <div id="offline-strip" class="offline-strip" hidden>Offline · showing last known summary</div>
      <main id="view-root" class="view-root" tabindex="-1"></main>
    </div>

    <nav id="member-bottom-nav" class="bottom-nav member-nav banking-bottom-nav" aria-label="Member navigation" hidden>
      <button type="button" data-route="home"><span data-icon="home"></span><em>Home</em></button>
      <button type="button" data-route="balance"><span data-icon="balance"></span><em>Balance</em></button>
      <button type="button" class="member-pay-action" data-action="report-payment"><span class="pay-nav-orb" data-icon="transfer"></span><em>Pay</em></button>
      <button type="button" data-route="payments"><span data-icon="payments"></span><em>Activity</em></button>
      <button type="button" data-route="more"><span data-icon="more"></span><em>More</em></button>
    </nav>

    <nav id="admin-bottom-nav" class="bottom-nav admin-nav" aria-label="Admin navigation" hidden>
      <button type="button" data-route="overview"><span data-icon="home"></span><em>Overview</em></button>
      <button type="button" data-action="open-add"><span data-icon="add"></span><em>Add</em></button>
      <button type="button" data-route="review"><span data-icon="review"></span><em>Review</em></button>
      <button type="button" data-route="manage"><span data-icon="more"></span><em>Manage</em></button>
    </nav>
  </div>

  <dialog id="sheet" class="bottom-sheet"><div id="sheet-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
